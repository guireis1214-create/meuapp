<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MenuFlow</title><style>
:root{--navy:#18283c;--orange:#f28b21;--bg:#f5f6f8;--green:#1c9961}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1c2733;font-family:system-ui,-apple-system,Segoe UI,Arial}header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header img{height:40px;width:40px;object-fit:contain}header h1{margin:0;font-size:22px;flex:1}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 18px #14243812}.hidden{display:none!important}button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:650;padding:11px 15px;cursor:pointer;margin:4px}button.alt{background:#e9edf2;color:#18283c}button.danger{background:#a73737}input,textarea,select{width:100%;border:1px solid #d7dce2;border-radius:9px;padding:11px;margin:5px 0 12px;font:inherit}label{font-weight:600;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.food,.rest{border:1px solid #e2e6eb;border-radius:14px;padding:14px}.food h3,.rest h3{margin:6px 0}.food .price{font-weight:800;color:var(--green)}.status{background:#f1f5f8;padding:4px 9px;border-radius:99px;font-size:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{background:#edf1f4;color:#233448}.tab.active{background:var(--navy);color:white}.muted{color:#66717e}.error{color:#a73737}.success{color:#19744b}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5e8ec}small{color:#66717e}@media(max-width:600px){main{margin:10px auto}.card{padding:14px}}
</style></head><body><header><img src="/logo.webp" alt="MenuFlow"><h1>MenuFlow</h1><span id="who"></span><button id="logout" class="alt hidden">Sair</button></header><main>
<section id="auth" class="card"><h2>Entrar ou criar conta</h2><p class="muted">Cada conta acessa somente sua própria área.</p><div class="tabs"><button class="tab active" id="loginTab">Entrar</button><button class="tab" id="clientTab">Criar conta cliente</button><button class="tab" id="restTab">Cadastrar restaurante</button></div><form id="loginForm"><label>E-mail</label><input name="email" type="email" autocomplete="username" required><label>Senha</label><input name="password" type="password" autocomplete="current-password" required><button>Entrar</button></form><form id="clientForm" class="hidden"><label>Nome</label><input name="name" required><label>E-mail</label><input name="email" type="email" required><label>Telefone</label><input name="phone"><label>Senha (mínimo 8 caracteres)</label><input name="password" type="password" minlength="8" required><button>Criar conta</button></form><form id="restaurantForm" class="hidden"><label>Nome do restaurante</label><input name="name" required><label>Responsável</label><input name="owner" required><label>E-mail (login)</label><input name="email" type="email" required><label>Telefone</label><input name="phone"><label>Endereço</label><input name="address"><label>Senha (mínimo 8 caracteres)</label><input name="password" type="password" minlength="8" required><button>Enviar cadastro</button><p class="muted">O restaurante entra na plataforma após aprovação do suporte.</p></form><p id="authMsg"></p></section>
<section id="area" class="hidden"><div class="card"><div class="tabs" id="areaTabs"></div><div id="areaContent"></div></div></section>
</main><script>
let token='',role='',restaurantId=null,userName='';const $=s=>document.querySelector(s);const api=async(path,opts={})=>{let headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;let r=await fetch('/api'+path,{...opts,headers:{...headers,...opts.headers}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Erro');return d};const msg=(s,cls='')=>{$('#authMsg').className=cls;$('#authMsg').textContent=s};function authTab(t){['loginForm','clientForm','restaurantForm'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==t));['loginTab','clientTab','restTab'].forEach(x=>$('#'+x).classList.remove('active'));$('#'+({loginForm:'loginTab',clientForm:'clientTab',restaurantForm:'restTab'}[t])).classList.add('active');msg('')}
$('#loginTab').onclick=()=>authTab('loginForm');$('#clientTab').onclick=()=>authTab('clientForm');$('#restTab').onclick=()=>authTab('restaurantForm');$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));let r=await api('/login',{method:'POST',body:JSON.stringify(d)});token=r.token;role=r.role;restaurantId=r.restaurant_id;userName=r.name;enter()}catch(x){msg(x.message,'error')}};
$('#clientForm').onsubmit=async e=>{e.preventDefault();try{await api('/register/client',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});msg('Conta criada. Faça login.','success');e.target.reset();authTab('loginForm')}catch(x){msg(x.message,'error')}};
$('#restaurantForm').onsubmit=async e=>{e.preventDefault();try{await api('/register/restaurant',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});msg('Solicitação enviada! Aguarde aprovação do suporte antes de entrar.','success');e.target.reset();authTab('loginForm')}catch(x){msg(x.message,'error')}};
function enter(){$('#auth').classList.add('hidden');$('#area').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#who').textContent=userName+' · '+role;role==='client'?clientArea():role==='restaurant'?restaurantArea():supportArea()}
$('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch{} token='';role='';$('#area').classList.add('hidden');$('#auth').classList.remove('hidden');$('#logout').classList.add('hidden');$('#who').textContent=''};
async function clientArea(){setTabs(['Restaurantes','Meus pedidos']);await showRestaurants()};function setTabs(items){$('#areaTabs').innerHTML=items.map((x,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${x}">${x}</button>`).join('');$('#areaTabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('#areaTabs .tab').forEach(x=>x.classList.toggle('active',x===b));if(role==='client')b.dataset.tab==='Restaurantes'?showRestaurants():myOrders();if(role==='restaurant')b.dataset.tab==='Cardápio'?rProducts():rOrders();if(role==='support')supportRestaurants()}}
async function showRestaurants(){try{let rs=await api('/client/restaurants');$('#areaContent').innerHTML='<h2>Escolha um restaurante</h2><div class="grid">'+rs.map(r=>`<article class="rest"><h3>${esc(r.name)}</h3><p>${esc(r.address||'')}</p><button onclick="openMenu(${r.id},'${esc(r.name)}')">Ver cardápio</button></article>`).join('')+'</div>'||'Nenhum restaurante disponível';if(!rs.length)$('#areaContent').innerHTML='<h2>Restaurantes</h2><p>Ainda não há restaurantes aprovados.</p>'}catch(e){$('#areaContent').textContent=e.message}}
let chosenRest=null,chosenName='';window.openMenu=async(id,name)=>{chosenRest=id;chosenName=name;let ps=await api(`/client/restaurants/${id}/products`);$('#areaContent').innerHTML=`<h2>${esc(name)} — Cardápio</h2><p>Escolha itens e personalize seu pedido.</p><div class="grid">${ps.map(p=>`<article class="food"><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><small>${esc(p.category)} · ${p.prep_minutes||15} min</small><p class="price">R$ ${Number(p.price).toFixed(2).replace('.',',')}</p><label>Quantidade</label><input type="number" min="0" max="50" value="0" data-p="${p.id}" data-price="${p.price}" data-name="${esc(p.name)}"><label>Extras / observações</label><input data-extra="${p.id}" placeholder="Ex.: adicional..." ><label>Remover ingredientes</label><input data-remove="${p.id}" placeholder="Ex.: sem cebola"><button class="alt" onclick="this.closest('.food').querySelector('[data-p]').value=Number(this.closest('.food').querySelector('[data-p]').value)+1">Adicionar</button></article>`).join('')}</div><label>Observações do pedido</label><textarea id="orderNote" placeholder="..."> </textarea><label>Endereço (se entrega)</label><input id="orderAddress"><label>Pagamento</label><select id="orderPayment"><option>PIX</option><option>Cartão</option><option>Dinheiro</option></select><button onclick="sendOrder()">Enviar pedido</button><button class="alt" onclick="showRestaurants()">Voltar</button><p id="orderMsg"></p>`};window.sendOrder=async()=>{let items=[...document.querySelectorAll('[data-p]')].filter(x=>Number(x.value)>0).map(x=>({product_id:Number(x.dataset.p),quantity:Number(x.value),extras:document.querySelector(`[data-extra="${x.dataset.p}"]`).value,remove:document.querySelector(`[data-remove="${x.dataset.p}"]`).value}));if(!items.length){$('#orderMsg').textContent='Selecione pelo menos um item.';return}try{let r=await api(`/client/restaurants/${chosenRest}/orders`,{method:'POST',body:JSON.stringify({items,customer_note:$('#orderNote').value,address:$('#orderAddress').value,payment_method:$('#orderPayment').value})});$('#orderMsg').textContent='Pedido #'+r.order_id+' enviado. Total: R$ '+r.total.toFixed(2).replace('.',',')}catch(e){$('#orderMsg').textContent=e.message}};
async function myOrders(){let x=await api('/client/orders');$('#areaContent').innerHTML='<h2>Meus pedidos</h2>'+x.map(o=>`<article class="card"><b>Pedido #${o.id}</b> · Restaurante ${o.restaurant_id}<p>R$ ${Number(o.total).toFixed(2)} · <span class="status">${o.status}</span></p><small>${esc(o.created_at)}</small></article>`).join('')||'Sem pedidos ainda'};
function restaurantArea(){setTabs(['Cardápio','Pedidos']);rProducts()};async function rProducts(){let ps=await api('/restaurant/products');$('#areaContent').innerHTML='<h2>Gerenciar cardápio</h2><button onclick="productForm()">Cadastrar produto</button><div class="grid">'+ps.map(p=>`<article class="food"><h3>${esc(p.name)}</h3><p>R$ ${Number(p.price).toFixed(2)}</p><p>${esc(p.description)}</p><button class="alt" onclick="productForm(${p.id})">Editar</button><button class="danger" onclick="delProduct(${p.id})">Excluir</button></article>`).join('')+'</div>'};window.productForm=async(id)=>{let old=id?(await api('/restaurant/products')).find(p=>p.id===id):null;$('#areaContent').innerHTML=`<h2>${id?'Editar':'Novo'} produto</h2><form id="productForm"><label>Nome</label><input name="name" value="${esc(old?.name||'')}" required><label>Categoria</label><input name="category" value="${esc(old?.category||'')}" required><label>Preço</label><input name="price" type="number" min="0" step=".01" value="${old?.price||''}" required><label>Descrição</label><textarea name="description">${esc(old?.description||'')}</textarea><label>Ingredientes</label><textarea name="ingredients">${esc(old?.ingredients||'')}</textarea><label>Tempo de preparo (min)</label><input name="prep_minutes" type="number" value="${old?.prep_minutes||15}"><label><input name="available" type="checkbox" ${old?.available!==0?'checked':''} style="width:auto"> Disponível</label><button>Salvar</button><button type="button" class="alt" onclick="rProducts()">Cancelar</button></form>`;$('#productForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.price=Number(d.price);d.prep_minutes=Number(d.prep_minutes);d.available=e.target.available.checked;try{await api('/restaurant/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(d)});rProducts()}catch(x){alert(x.message)}}};window.delProduct=async id=>{if(confirm('Excluir produto?')){await api('/restaurant/products/'+id,{method:'DELETE'});rProducts()}};async function rOrders(){let o=await api('/restaurant/orders');$('#areaContent').innerHTML='<h2>Pedidos recebidos</h2>'+o.map(x=>`<article class="card"><b>#${x.id} · ${esc(x.customer)}</b><p>Total: R$ ${Number(x.total).toFixed(2)} · <span class="status">${x.status}</span></p><p><small>${esc(x.items_json)}</small></p><select id="st${x.id}"><option>Aguardando</option><option>Em preparo</option><option>Pronto</option><option>Saiu para entrega</option><option>Concluído</option><option>Cancelado</option></select><button onclick="updOrder(${x.id})">Atualizar</button></article>`).join('')||'Sem pedidos'};window.updOrder=async id=>{await api('/restaurant/orders/'+id,{method:'PATCH',body:JSON.stringify({status:$('#st'+id).value})});rOrders()};
function supportArea(){setTabs(['Restaurantes']);supportRestaurants()};async function supportRestaurants(){let r=await api('/support/restaurants');$('#areaContent').innerHTML='<h2>Cadastro e aprovação de restaurantes</h2>'+r.map(x=>`<article class="card"><h3>${esc(x.name)}</h3><p>Responsável: ${esc(x.owner)} · ${esc(x.email)}</p><p>${esc(x.address)} · <span class="status">${x.status}</span></p><select id="s${x.id}"><option>Pendente</option><option>Aprovado</option><option>Suspenso</option></select><button onclick="setStatus(${x.id})">Salvar status</button></article>`).join('')||'Sem restaurantes'};window.setStatus=async id=>{await api('/support/restaurants/'+id,{method:'PATCH',body:JSON.stringify({status:$('#s'+id).value})});supportRestaurants()};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
